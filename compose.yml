services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: helicon
      POSTGRES_USER: helicon
      POSTGRES_PASSWORD: helicon_dev
    ports:
      - '7001:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helicon']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
