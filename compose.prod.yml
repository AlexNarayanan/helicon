services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://helicon:${POSTGRES_PASSWORD}@postgres:5432/helicon
      SETLISTFM_API_KEY: ${SETLISTFM_API_KEY}
      NODE_ENV: production
      PORT: '7000'
    ports:
      - '7000:7000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: helicon
      POSTGRES_USER: helicon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helicon']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
