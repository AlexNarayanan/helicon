<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Ibanez-style headstock, rotated 35° CW from vertical so the tip points
    upper-right. String lines trail from the nut toward lower-left (neck).

    Pre-rotation vertices (90° CCW from horizontal icon):
      A (28, 95)  nut bottom-left
      B (27, 16)  top of left/peg-side edge
      C (46,  5)  sharp tip
      D (74, 95)  nut bottom-right
  -->
  <g transform="rotate(35, 50, 50)">
    <!-- neck strings trailing below nut (lower-left after rotation) -->
    <line x1="29" y1="93" x2="29" y2="155" stroke="#7c6af7" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="38" y1="93" x2="38" y2="155" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="47" y1="93" x2="47" y2="155" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="56" y1="93" x2="56" y2="155" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="65" y1="93" x2="65" y2="155" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="73" y1="93" x2="73" y2="155" stroke="#7c6af7" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- headstock body -->
    <path
      d="M 33,95
         Q 28,95   27.9,90
         L 27.1,21
         Q 27,16   31.3,13.5
         L 43.4,6.5
         Q 46,5    46.9,7.9
         L 72.5,90.2
         Q 74,95   69,95
         Z"
      fill="#7c6af7"
      stroke="#5a4be8"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- nut line -->
    <line x1="27" y1="95" x2="75" y2="95" stroke="#5a4be8" stroke-width="3" stroke-linecap="round"/>
    <!-- 6 tuning peg buttons along the peg-side edge -->
    <circle cx="35" cy="20" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="20" r="1.7" fill="#5a4be8"/>
    <circle cx="35" cy="32" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="32" r="1.7" fill="#5a4be8"/>
    <circle cx="35" cy="44" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="44" r="1.7" fill="#5a4be8"/>
    <circle cx="35" cy="56" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="56" r="1.7" fill="#5a4be8"/>
    <circle cx="35" cy="68" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="68" r="1.7" fill="#5a4be8"/>
    <circle cx="35" cy="80" r="4"   fill="#e0deff" opacity="0.92"/>
    <circle cx="35" cy="80" r="1.7" fill="#5a4be8"/>
  </g>
</svg>
